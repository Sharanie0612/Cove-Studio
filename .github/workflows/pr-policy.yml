name: PR conventions
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  title-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate title and documentation
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/verify_contribution.mjs
