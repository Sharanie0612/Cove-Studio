<style>
  *{box-sizing:border-box}body{margin:0;padding:24px;color:var(--text,#243b5b);background:var(--bg,#fff);font:14px/1.6 system-ui,sans-serif}
  main{max-width:560px;margin:auto;padding:24px;border:1px solid var(--border,#ddd);border-radius:12px}
  button{padding:9px 16px;margin:4px;border:1px solid var(--border,#ddd);border-radius:8px;color:inherit;background:var(--surface,#fff);cursor:pointer}
  output{display:block;font-size:36px}#error{color:var(--red,#b22)}input{padding:8px;color:inherit;background:var(--surface,#fff);border:1px solid var(--border,#ddd);border-radius:8px}
</style>
<main>
  <h1 id="title"></h1><p id="description"></p>
  <output aria-label="Counter">0</output>
  <button id="read"></button><button id="write"></button>
  <p><label id="draft-label" for="draft"></label> <input id="draft" /></p>
  <p id="error" role="alert"></p>
</main>
<script>
  const api = window.Cove;
  const labels = context => {
    const english = context.locale === 'en-US';
    document.querySelector('#title').textContent = english ? 'Plugin-owned interface' : '插件自带界面';
    document.querySelector('#description').textContent = english ? 'Reads stay local; writes require a confirmation in Cove.' : '读取无需 AI 授权，写操作在 Cove 主界面确认。';
    document.querySelector('#read').textContent = english ? 'Read counter' : '读取计数';
    document.querySelector('#write').textContent = english ? 'Increment' : '增加计数';
    document.querySelector('#draft-label').textContent = english ? 'Draft' : '草稿';
  };
  const call = async (name, args = {}) => {
    document.querySelector('#error').textContent = '';
    try { const result = await api.call(name, args); document.querySelector('output').textContent = result.value; }
    catch(error) { document.querySelector('#error').textContent = error.message; }
  };
  api.on('context', labels);
  api.ready.then(context => { labels(context); call('snapshot'); });
  document.querySelector('#read').onclick = () => call('snapshot');
  document.querySelector('#write').onclick = () => call('increment', {amount: 1});
</script>
